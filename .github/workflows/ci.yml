name: CI

# Every push to a working branch and every pull request: the house rules of
# this project as a script, and a firmware build. The release itself stays
# in build-all-boards.yml and runs on a tag push only.
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**', 'feat/**']
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']
  pull_request:
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']
  # By hand from the Actions tab, e.g. for a branch whose push came while
  # Actions was switched off for the repository (21.11.2026).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (node --check for the page scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scripts/check.sh
        run: scripts/check.sh
      - name: Test Bluetooth discovery
        run: python3 test/test_ble_discovery.py
      - name: Test auto weighing on an empty pad
        run: python3 test/test_auto_weight_pad.py
      - name: Test AMS grid redraw
        run: python3 test/test_ams_grid_redraw.py
      - name: Test AMS weights after a quick printer switch
        run: python3 test/test_ams_weights_owed.py
      - name: Test release asset digest
        run: python3 test/test_asset_digest.py
      - name: Test release notes cut
        run: python3 test/test_notes_cut.py
      - name: Test self-deleting tasks free what they declare
        run: python3 test/test_task_self_delete.py
      - name: Test copy list keeps tagged spools
        run: python3 test/test_copy_list_tagged.py
      - name: Test link by number judges the article number
        run: python3 test/test_link_number_article.py
      - name: Test material and name joined once
        run: python3 test/test_join_material_name.py
      - name: Test native tag probe
        run: python3 test/test_native_tag_probe.py
      - name: Test recheck pace
        run: python3 test/test_recheck_pace.py
      - name: Test spool temperature on a written tag
        run: python3 test/test_spool_temp.py
      - name: Test tag writes stay inside the user memory
        run: python3 test/test_ntag_pages.py
      - name: Test host lookup rules
        run: python3 test/test_host_lookup_rules.py
      - name: Test tag format in the tag relation
        run: python3 test/test_tag_format_rules.py
      - name: Test AMS fill level without a chip
        run: python3 test/test_ams_printer_remain.py
      - name: Test AMS unit room for the external holder
        run: python3 test/test_ams_unit_room.py
      - name: Test remembered WiFi networks
        run: python3 test/test_wifi_known_rules.py

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    # The platform's build scripts live in a virtualenv of their own and pull
    # the "pioarduino" package into it. 6.2.0.post1, published on 2026-10-26,
    # reads as a pre-release to the platform's own ">=6.2.0" check, so the
    # second pass of every fresh build died with IncompatiblePlatform. uv
    # reads this file when it installs into that virtualenv.
    env:
      UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
    strategy:
      matrix:
        env: [wt32-sc01-plus]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: Refuse a binary an installed device could not take
        # Installs since v0.8.0 get 6 MB app slots, but OTA never rewrites
        # the partition table: every scale first flashed before that still
        # has 3 MB slots. A larger binary would be refused by esp_ota_begin()
        # on all of them, so the build fails here first.
        # This fork outgrew 3 MB: it is flashed by USB with the 6 MB table and
        # updated from its own releases, so the gate is the 6 MB slot.
        run: |
          SIZE=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot of partitions.csv"
            exit 1
          fi
      # Here rather than in the house-rules job: both tools measure icons from
      # LVGL's symbol header, and that only exists once the build has unpacked
      # the library.
      - name: French column and width budgets
        run: |
          if [ -f tools/lang_fr.py ]; then
            python3 tools/lang_fr.py check
            python3 tools/fit_check.py --gate
          fi
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.sha }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14
