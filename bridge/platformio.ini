; Druckbruecke (print bridge): WLAN -> Bluetooth Classic SPP for the
; TYPONOS PM240. Its own project, built with "pio run -d bridge"; the scale's
; platformio.ini in the repository root is not involved.

[env:esp32dev]
; The same pinned platform as the scale: pioarduino 55.03.312-1, Arduino core
; 3.3.12 on ESP-IDF 5.5. Its precompiled ESP32 libraries have Bluedroid with
; Classic BT and SPP switched on, so BluetoothSerial (SPP master) builds and
; links as it is. Core 3.x marks the class deprecated for 4.0; printer.cpp
; says why that is fine here. Needs PlatformIO 6.2 or newer.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; The original ESP32 (WROOM-32): the S3, C3 and C6 have no Classic Bluetooth.
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; 4 MB flash, two 1.9 MB app slots for updates over the web page, 128 kB
; SPIFFS (unused). WiFi, Bluedroid and the web server come to about 1.75 MB
; on core 3.x, which the default table's 1.25 MB slots would not hold.
board_build.partitions = min_spiffs.csv

; Warnings for our own sources only; the framework's are not ours to fix.
build_src_flags =
    -Wall
    -Wextra

lib_deps =
    bblanchon/ArduinoJson@7.4.3
